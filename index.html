<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 探究の問いづくりカードガチャ ✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: M PLUS Rounded 1c -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #fff9c4 50%, #fce4ec 100%);
            min-height: 100vh;
        }

        /* 3D Card Flip Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }
        .card-inner.flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
        }
        .card-back {
            transform: rotateY(180deg);
        }

        /* Custom Bounce Animation for Button */
        @keyframes bouncy {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.03); }
        }
        .animate-bounce-gentle {
            animation: bouncy 2s infinite;
        }

        /* Shimmer background on card back */
        .shimmer {
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.4) 100%);
        }

        /* Custom Scrollbar for collection */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-700 flex flex-col min-h-screen p-3 md:p-6 select-none">

    <!-- Header -->
    <header class="max-w-3xl mx-auto w-full text-center my-2 md:my-3">
        <div class="inline-block bg-white/80 backdrop-blur-md px-6 py-1.5 rounded-full shadow-sm mb-2 border border-white">
            <span class="text-xs md:text-sm font-bold text-teal-600"><i class="fa-solid fa-lightbulb text-yellow-400 mr-1"></i> 中学生のための探究サポート</span>
        </div>
        <h1 class="text-2xl md:text-4xl font-extrabold text-slate-800 tracking-wide drop-shadow-sm flex items-center justify-center gap-2">
            <span>✨ 問いづくりカードガチャ ✨</span>
        </h1>
        <p class="text-xs md:text-sm text-slate-600 mt-1 font-medium">
            カードを引いて、探究テーマの「新しい視点」を発見しよう！
        </p>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto w-full flex-1 flex flex-col items-center justify-start gap-4 my-1">

        <!-- Theme Input Area -->
        <div class="w-full bg-white/70 backdrop-blur-md rounded-2xl p-3.5 shadow-sm border border-white/80">
            <label for="userTheme" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-1">
                <i class="fa-solid fa-pen-nib text-teal-500"></i> あなたが調べているテーマ（任意）：
            </label>
            <div class="flex gap-2">
                <input type="text" id="userTheme" placeholder="例：プラスチックごみ、食品ロス、学校のルール、スマホの使い方..." 
                       class="w-full px-4 py-2 text-sm rounded-xl border-2 border-teal-100 focus:border-teal-400 focus:outline-none transition bg-white/90">
            </div>
        </div>

        <!-- Card Container (Size increased for better visibility) -->
        <div class="w-full max-w-[280px] sm:max-w-[320px] aspect-[3/4] perspective-1000 cursor-pointer my-2 relative" id="cardContainer" onclick="drawCard()">
            <div class="card-inner shadow-xl rounded-3xl" id="cardInner">
                
                <!-- Card Front (Default Cover / Back of Playing Card) -->
                <div class="card-front bg-gradient-to-br from-indigo-400 via-purple-400 to-pink-400 border-4 border-white flex flex-col items-center justify-center p-6 text-white text-center relative overflow-hidden shadow-inner">
                    <!-- Pattern Decorative Elements -->
                    <div class="absolute inset-2 border-2 border-white/40 rounded-2xl pointer-events-none"></div>
                    <div class="absolute -top-10 -left-10 w-32 h-32 bg-white/10 rounded-full blur-xl"></div>
                    <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-white/10 rounded-full blur-xl"></div>

                    <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mb-4 animate-pulse">
                        <i class="fa-solid fa-question text-4xl text-white"></i>
                    </div>
                    <p class="text-xl font-bold tracking-wider mb-1">カードをタップ！</p>
                    <p class="text-xs text-white/80">または下のボタンを押してね</p>

                    <div class="absolute bottom-6 text-xs bg-white/20 px-3 py-1 rounded-full border border-white/30">
                        <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 全15種類のひらめき
                    </div>
                </div>

                <!-- Card Back (Revealed Card) -->
                <div class="card-back bg-white border-4 border-teal-200 flex flex-col justify-between p-6 text-slate-700 absolute inset-0 overflow-hidden shadow-xl" id="cardBackContent">
                    <!-- Card back design dynamically populated by JS -->
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center gap-3 w-full max-w-sm">
            <button onclick="drawCard()" id="drawBtn" 
                    class="w-full py-3.5 px-6 bg-gradient-to-r from-teal-400 to-emerald-400 hover:from-teal-500 hover:to-emerald-500 text-white font-extrabold text-lg rounded-2xl shadow-lg hover:shadow-xl transform active:scale-95 transition-all flex items-center justify-center gap-2 animate-bounce-gentle">
                <i class="fa-solid fa-dice text-xl"></i>
                <span id="btnText">カードを引く！</span>
            </button>
            
            <button onclick="toggleSound()" id="soundBtn" title="効果音のON/OFF"
                    class="p-3.5 bg-white/80 hover:bg-white text-slate-600 rounded-2xl shadow-md border border-white transition flex items-center justify-center">
                <i class="fa-solid fa-volume-high text-lg" id="soundIcon"></i>
            </button>
        </div>

        <!-- Question Helper / Workspace (Made Compact) -->
        <div id="questionWorkspace" class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3.5 shadow-sm border border-teal-100 hidden transition-all">
            <div class="flex items-center gap-2 text-teal-600 font-bold mb-1.5 text-xs sm:text-sm">
                <i class="fa-solid fa-comments"></i>
                <h3>引いた視点で「問い」を作ってみよう！</h3>
            </div>
            
            <p id="generatedQuestionHint" class="text-xs bg-teal-50 text-teal-900 p-2.5 rounded-xl border border-teal-200 font-medium mb-2.5">
                <!-- Dynamic hint -->
            </p>

            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="myQuestionInput" placeholder="思いついた問いをメモしてみよう！" 
                       class="flex-1 px-3 py-1.5 text-xs sm:text-sm rounded-xl border border-slate-200 focus:border-teal-400 focus:outline-none">
                <button onclick="saveMyQuestion()" 
                        class="px-3 py-1.5 bg-teal-500 hover:bg-teal-600 text-white text-xs font-bold rounded-xl shadow transition shrink-0">
                    <i class="fa-solid fa-bookmark mr-1"></i> メモに保存
                </button>
            </div>
            <p id="saveMessage" class="text-xs text-emerald-600 mt-1 font-bold hidden"><i class="fa-solid fa-check"></i> 保存しました！</p>
        </div>

        <!-- Bottom Section: Collection & History (Made Compact) -->
        <div class="w-full bg-white/80 backdrop-blur-md rounded-2xl p-3.5 shadow-md border border-white/90 my-1">
            <!-- Tabs -->
            <div class="flex border-b border-slate-200 mb-2.5 gap-3">
                <button id="tabHistoryBtn" onclick="switchTab('history')" class="pb-1.5 text-xs font-bold text-teal-600 border-b-2 border-teal-500 transition">
                    <i class="fa-solid fa-clock-rotate-left mr-1"></i> 引いた履歴 (<span id="historyCount">0</span>)
                </button>
                <button id="tabSavedBtn" onclick="switchTab('saved')" class="pb-1.5 text-xs font-bold text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-pen-to-square mr-1"></i> マイ作成問いメモ (<span id="savedCount">0</span>)
                </button>
                <button id="tabCollectionBtn" onclick="switchTab('collection')" class="pb-1.5 text-xs font-bold text-slate-400 hover:text-slate-600 transition ml-auto">
                    <i class="fa-solid fa-shapes mr-1"></i> 収集率 (<span id="collectionProgress">0/15</span>)
                </button>
            </div>

            <!-- Tab Content: History -->
            <div id="tabHistory" class="space-y-1.5">
                <p id="noHistoryText" class="text-xs text-slate-400 text-center py-2">まだカードを引いていません。ボタンを押してカードを引いてね！</p>
                <div id="historyList" class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-0.5"></div>
            </div>

            <!-- Tab Content: Saved Notes -->
            <div id="tabSaved" class="space-y-1.5 hidden">
                <p id="noSavedText" class="text-xs text-slate-400 text-center py-2">まだ保存された問いがありません。ひらめいた問いを記録しよう！</p>
                <div id="savedList" class="space-y-1.5 max-h-32 overflow-y-auto p-0.5"></div>
            </div>

            <!-- Tab Content: Collection Matrix -->
            <div id="tabCollection" class="hidden">
                <p class="text-[11px] text-slate-500 mb-2">引いたことのあるカードは明るく表示されるよ！全15種類を集めよう。</p>
                <div id="collectionGrid" class="grid grid-cols-3 sm:grid-cols-5 gap-1.5"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 my-4">
        <p>探究学習の「問いづくり」をサポートするカードガチャ &copy; 2026</p>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-xs shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-yellow-400"></i>
        <span id="toastMsg">通知メッセージ</span>
    </div>

    <script>
        // --- DATA DEFINITION (15 Cards) ---
        const CARDS_DATA = [
            { id: 1, title: "「なぜ？」", sub: "「どうして？」と考えてみよう。", color: "from-amber-400 to-orange-400", lightBg: "bg-amber-50", borderColor: "border-amber-300", textColor: "text-amber-800", icon: "fa-circle-question" },
            { id: 2, title: "「どういうこと？」", sub: "分からない言葉や文を見つけよう。", color: "from-sky-400 to-blue-400", lightBg: "bg-sky-50", borderColor: "border-sky-300", textColor: "text-sky-800", icon: "fa-magnifying-glass" },
            { id: 3, title: "「本当に？」", sub: "「本当にそうなの？」と疑ってみよう。", color: "from-rose-400 to-red-400", lightBg: "bg-rose-50", borderColor: "border-rose-300", textColor: "text-rose-800", icon: "fa-shield-halved" },
            { id: 4, title: "「具体的には？」", sub: "実際の例を考えてみよう。", color: "from-emerald-400 to-teal-400", lightBg: "bg-emerald-50", borderColor: "border-emerald-300", textColor: "text-emerald-800", icon: "fa-list-check" },
            { id: 5, title: "「反対だったら？」", sub: "反対の立場・考えから見てみよう。", color: "from-purple-400 to-indigo-400", lightBg: "bg-purple-50", borderColor: "border-purple-300", textColor: "text-purple-800", icon: "fa-arrows-rotate" },
            { id: 6, title: "「もしも？」", sub: "条件を一つ変えてみよう。", color: "from-pink-400 to-rose-400", lightBg: "bg-pink-50", borderColor: "border-pink-300", textColor: "text-pink-800", icon: "fa-wand-magic-sparkles" },
            { id: 7, title: "「自分だったら？」", sub: "自分の立場に置き換えてみよう。", color: "from-teal-400 to-cyan-400", lightBg: "bg-teal-50", borderColor: "border-teal-300", textColor: "text-teal-800", icon: "fa-user-astronaut" },
            { id: 8, title: "「ほかには？」", sub: "別の答え・方法・可能性を探そう。", color: "from-lime-400 to-green-400", lightBg: "bg-lime-50", borderColor: "border-lime-300", textColor: "text-lime-800", icon: "fa-compass" },
            { id: 9, title: "「同じ？ 違う？」", sub: "二つのものを比べてみよう。", color: "from-violet-400 to-purple-400", lightBg: "bg-violet-50", borderColor: "border-violet-300", textColor: "text-violet-800", icon: "fa-scale-balanced" },
            { id: 10, title: "「いつでも？」", sub: "別の場面でも同じことが言える？", color: "from-amber-400 to-yellow-500", lightBg: "bg-yellow-50", borderColor: "border-yellow-300", textColor: "text-yellow-800", icon: "fa-clock" },
            { id: 11, title: "「誰でも？」", sub: "すべての人に当てはまる？", color: "from-blue-400 to-indigo-400", lightBg: "bg-blue-50", borderColor: "border-blue-300", textColor: "text-blue-800", icon: "fa-users" },
            { id: 12, title: "「どこまで？」", sub: "どこから先は当てはまらない？", color: "from-fuchsia-400 to-pink-500", lightBg: "bg-fuchsia-50", borderColor: "border-fuchsia-300", textColor: "text-fuchsia-800", icon: "fa-ruler-horizontal" },
            { id: 13, title: "「自分にもある？」", sub: "自分の経験とつなげてみよう。", color: "from-cyan-400 to-blue-500", lightBg: "bg-cyan-50", borderColor: "border-cyan-300", textColor: "text-cyan-800", icon: "fa-heart" },
            { id: 14, title: "「どうなる？」", sub: "そのことが起きたら、何が起こる？", color: "from-orange-400 to-amber-500", lightBg: "bg-orange-50", borderColor: "border-orange-300", textColor: "text-orange-800", icon: "fa-bolt" },
            { id: 15, title: "「じゃあ、どうする？」", sub: "問題を解決する方法を考えてみよう。", color: "from-emerald-400 to-green-500", lightBg: "bg-green-50", borderColor: "border-green-300", textColor: "text-green-800", icon: "fa-lightbulb" }
        ];

        // --- STATE VARIABLES ---
        let currentCard = null;
        let isFlipped = false;
        let isAnimating = false;
        let soundEnabled = true;
        let history = [];
        let savedQuestions = [];
        let collectedSet = new Set();

        // --- WEB AUDIO API FOR SOUND EFFECTS ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Play Synthesized Sound Effects
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;

                if (type === 'cardFlip') {
                    // Soft pop sound
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'fanfare') {
                    // Arpeggio chime sound
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.15, now + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + i * 0.08);
                        osc.stop(now + i * 0.08 + 0.3);
                    });
                } else if (type === 'save') {
                    // High sparkle chime
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) {
                console.log("Audio play deferred", e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-lg';
                showToast("効果音をONにしました");
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-lg text-slate-400';
                showToast("効果音をOFFにしました");
            }
        }

        // --- DRAW CARD LOGIC ---
        function drawCard() {
            if (isAnimating) return;
            isAnimating = true;

            const cardInner = document.getElementById('cardInner');
            const btnText = document.getElementById('btnText');

            // If card is already flipped front-face up, flip it back first before picking new
            if (isFlipped) {
                cardInner.classList.remove('flipped');
                playSound('cardFlip');
                
                setTimeout(() => {
                    selectRandomCardAndFlip();
                }, 400);
            } else {
                selectRandomCardAndFlip();
            }
        }

        function selectRandomCardAndFlip() {
            const cardInner = document.getElementById('cardInner');
            const randomIndex = Math.floor(Math.random() * CARDS_DATA.length);
            currentCard = CARDS_DATA[randomIndex];

            // Render Card Back Content
            renderCardBack(currentCard);

            // Trigger 3D flip after slight delay
            setTimeout(() => {
                cardInner.classList.add('flipped');
                isFlipped = true;
                playSound('fanfare');

                // Trigger confetti burst
                confetti({
                    particleCount: 40,
                    spread: 60,
                    origin: { y: 0.6 },
                    colors: ['#2dd4bf', '#fbbf24', '#f472b6', '#60a5fa']
                });

                // Add to history and collection
                addToHistory(currentCard);
                collectedSet.add(currentCard.id);
                updateCollectionUI();

                // Update Workspace Hint
                updateWorkspaceHint();

                document.getElementById('btnText').innerText = "もう一度引く！";
                isAnimating = false;
            }, 150);
        }

        // --- STREAMING_CHUNK:Rendering card templates and dynamic updates... ---
        function renderCardBack(card) {
            const backContainer = document.getElementById('cardBackContent');
            
            backContainer.className = `card-back ${card.lightBg} border-4 ${card.borderColor} flex flex-col justify-between p-6 text-slate-700 absolute inset-0 overflow-hidden shadow-xl`;

            backContainer.innerHTML = `
                <!-- Top Badge -->
                <div class="flex justify-between items-center z-10">
                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-white/80 shadow-sm border ${card.borderColor} ${card.textColor}">
                        No.${card.id} / 15
                    </span>
                    <i class="fa-solid ${card.icon} text-2xl ${card.textColor} opacity-60"></i>
                </div>

                <!-- Center Main Content -->
                <div class="my-auto text-center z-10 px-2">
                    <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gradient-to-tr ${card.color} text-white flex items-center justify-center shadow-lg transform -rotate-3">
                        <i class="fa-solid ${card.icon} text-3xl"></i>
                    </div>
                    <h2 class="text-2xl md:text-3xl font-black ${card.textColor} tracking-tight mb-2">
                        ${card.title}
                    </h2>
                    <div class="w-12 h-1 bg-gradient-to-r ${card.color} mx-auto rounded-full mb-3"></div>
                    <p class="text-sm md:text-base font-bold text-slate-700 leading-relaxed bg-white/70 p-3 rounded-xl border border-white">
                        ${card.sub}
                    </p>
                </div>

                <!-- Bottom Helper Text -->
                <div class="text-center z-10">
                    <p class="text-xs font-semibold text-slate-400">
                        ✨ この切り口でテーマを見つめ直してみよう
                    </p>
                </div>

                <!-- Background Shimmer Decor -->
                <div class="absolute -bottom-12 -right-12 w-36 h-36 bg-gradient-to-tr ${card.color} opacity-10 rounded-full blur-xl pointer-events-none"></div>
            `;
        }

        // --- WORKSPACE & HINT GENERATION ---
        function updateWorkspaceHint() {
            const workspace = document.getElementById('questionWorkspace');
            const hintElem = document.getElementById('generatedQuestionHint');
            const userTheme = document.getElementById('userTheme').value.trim();

            workspace.classList.remove('hidden');

            const themeText = userTheme ? `「${userTheme}」` : "「あなたのテーマ」";
            
            hintElem.innerHTML = `
                ヒント： ${themeText} について、<br>
                <span class="text-teal-700 font-extrabold text-base">『${currentCard.title} ${currentCard.sub}』</span><br>
                という視点で問いをつくってみよう！
            `;

            // Reset input and message
            document.getElementById('myQuestionInput').value = "";
            document.getElementById('saveMessage').classList.add('hidden');
        }

        function saveMyQuestion() {
            const input = document.getElementById('myQuestionInput');
            const text = input.value.trim();
            const userTheme = document.getElementById('userTheme').value.trim();

            if (!text) {
                showToast("問いの文章を入力してね！");
                return;
            }

            const newEntry = {
                id: Date.now(),
                question: text,
                cardTitle: currentCard ? currentCard.title : "ひらめき",
                theme: userTheme || "指定なし",
                date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            savedQuestions.unshift(newEntry);
            updateSavedUI();
            playSound('save');

            document.getElementById('saveMessage').classList.remove('hidden');
            input.value = "";

            showToast("マイ問いメモに保存しました！");
        }

        // --- HISTORY & COLLECTION MANAGERS ---
        function addToHistory(card) {
            history.unshift({
                ...card,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const historyList = document.getElementById('historyList');
            const noHistoryText = document.getElementById('noHistoryText');
            document.getElementById('historyCount').innerText = history.length;

            if (history.length === 0) {
                noHistoryText.classList.remove('hidden');
                historyList.innerHTML = '';
                return;
            }

            noHistoryText.classList.add('hidden');
            historyList.innerHTML = history.map((item, index) => `
                <div onclick="previewCardById(${item.id})" 
                     class="cursor-pointer bg-white hover:bg-teal-50 border border-slate-200 hover:border-teal-300 rounded-xl px-3 py-1.5 shadow-sm text-xs flex items-center gap-1.5 transition transform hover:scale-105">
                    <span class="w-2 h-2 rounded-full bg-teal-400"></span>
                    <span class="font-bold text-slate-700">${item.title}</span>
                    <span class="text-slate-400 text-[10px]">${item.timestamp}</span>
                </div>
            `).join('');
        }

        function updateSavedUI() {
            const savedList = document.getElementById('savedList');
            const noSavedText = document.getElementById('noSavedText');
            document.getElementById('savedCount').innerText = savedQuestions.length;

            if (savedQuestions.length === 0) {
                noSavedText.classList.remove('hidden');
                savedList.innerHTML = '';
                return;
            }

            noSavedText.classList.add('hidden');
            savedList.innerHTML = savedQuestions.map(item => `
                <div class="bg-white p-3 rounded-xl border border-teal-100 shadow-sm relative group">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] font-bold bg-teal-100 text-teal-800 px-2 py-0.5 rounded-full">
                            視点: ${item.cardTitle} | テーマ: ${item.theme}
                        </span>
                        <button onclick="deleteSavedQuestion(${item.id})" class="text-slate-300 hover:text-rose-500 text-xs px-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    <p class="text-sm font-bold text-slate-800">${escapeHtml(item.question)}</p>
                    <div class="flex justify-between items-center mt-2 pt-1 border-t border-slate-100">
                        <span class="text-[10px] text-slate-400">${item.date}</span>
                        <button onclick="copyToClipboard('${escapeJsString(item.question)}')" class="text-xs text-teal-600 hover:text-teal-700 font-bold flex items-center gap-1">
                            <i class="fa-regular fa-copy"></i> コピー
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function deleteSavedQuestion(id) {
            savedQuestions = savedQuestions.filter(q => q.id !== id);
            updateSavedUI();
            showToast("削除しました");
        }

        function updateCollectionUI() {
            const grid = document.getElementById('collectionGrid');
            document.getElementById('collectionProgress').innerText = `${collectedSet.size}/15`;

            grid.innerHTML = CARDS_DATA.map(card => {
                const isCollected = collectedSet.has(card.id);
                return `
                    <div onclick="${isCollected ? `previewCardById(${card.id})` : ''}" 
                         class="p-2 rounded-xl border text-center transition ${isCollected ? `bg-white ${card.borderColor} shadow-sm cursor-pointer hover:scale-105` : 'bg-slate-100 border-slate-200 opacity-50 cursor-not-allowed'}">
                        <div class="text-lg mb-1">
                            <i class="fa-solid ${isCollected ? card.icon : 'fa-lock'} ${isCollected ? card.textColor : 'text-slate-400'}"></i>
                        </div>
                        <div class="text-[10px] font-bold ${isCollected ? 'text-slate-700' : 'text-slate-400'} truncate">
                            ${isCollected ? card.title : '???'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function previewCardById(id) {
            const card = CARDS_DATA.find(c => c.id === id);
            if (!card) return;

            currentCard = card;
            const cardInner = document.getElementById('cardInner');
            
            if (isFlipped) {
                cardInner.classList.remove('flipped');
                setTimeout(() => {
                    renderCardBack(card);
                    cardInner.classList.add('flipped');
                    playSound('cardFlip');
                    updateWorkspaceHint();
                }, 300);
            } else {
                renderCardBack(card);
                cardInner.classList.add('flipped');
                isFlipped = true;
                playSound('cardFlip');
                updateWorkspaceHint();
            }
        }

        // --- TAB SWITCHING ---
        function switchTab(tabName) {
            const tabs = ['history', 'saved', 'collection'];
            tabs.forEach(tab => {
                const content = document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`);
                const btn = document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}Btn`);
                
                if (tab === tabName) {
                    content.classList.remove('hidden');
                    btn.className = "pb-2 text-sm font-bold text-teal-600 border-b-2 border-teal-500 transition";
                } else {
                    content.classList.add('hidden');
                    btn.className = "pb-2 text-sm font-bold text-slate-400 hover:text-slate-600 transition";
                }
            });
        }

        // --- UTILITY FUNCTIONS ---
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        function copyToClipboard(text) {
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast("クリップボードにコピーしました！");
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function escapeJsString(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            updateHistoryUI();
            updateSavedUI();
            updateCollectionUI();
        });
    </script>
</body>
</html>
